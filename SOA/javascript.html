<body>
<script>
    var cadena="Hola Mundo";
    console.log(typeof(cadena));

    console.log(entero);
    console.log(typeof(entero));

    var MijavascriptEntero=JSON.stringify(entero);

    var arreglo=["Lunes","Martes","Miercoles"];
    console.log(arreglo[1]);
    console.log(typeof(arreglo[1]));

    var Mijavascript=JSON.stringify(arreglo);
    console.log(typeof(Mijavascript));

    var booleano= true;
    console.log(booleano);
    console.log(typeof(booleano));

    var Mijavascript=JSON.stringify(booleano);
    console.log(typeof(Mijavascript)); 


    var arregloObjetos=[
        {nombre:"Juan",edad:25,educacion:[{"primaria":"la salle","secundaria":"bolivar"}]},
        {nombre:"Maria",edad:30,educacion:[{"primaria":"bolivar","secundaria":"la salle"}]},
        {nombre:"Pedro",edad:35,educacion:[{"primaria":"pio","secundaria":"pio"}]}
    ];

    for(var i=0;i<arregloObjetos.length;i++){
        console.log("Nombre: "+ arregloObjetos[i].nombre+" Educacion primaria:"+arregloObjetos[i].educacion[0].primaria);
    }

</script>
